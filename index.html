<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordenação de Cartas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<input id="tamanho" type="number" min="1" max="20" value="10">

<select id="tipoVetor">
    <option value="aleatorio">Aleatório</option>
    <option value="ordenado">Ordenado</option>
    <option value="invertido">Invertido</option>
    <option value="quase">Quase Ordenado</option>
</select>

<button id="btnGerar">Gerar Cartas</button>

<select id="algoritmo">
    <option value="bubble">Bubble Sort</option>
    <option value="selection">Selection Sort</option>
    <option value="insertion">Insertion Sort</option>
    <option value="quick">Quick Sort</option>
    <option value="shell">Shell Sort</option>
    <option value="heap">Heap Sort</option>
    <option value="merge">Merge Sort</option>
</select>

<button id="btnOrdenar">Ordenar</button>

<div id="resultado">
    <p><strong>Tempo:</strong> <span id="tempo">-</span></p>
    <p><strong>Comparações:</strong> <span id="comparacoes">-</span></p>
    <p><strong>Trocas:</strong> <span id="trocas">-</span></p>
</div>

<div id="mesa"></div>

<script type="module" src="script.js"></script>

</body>
</html>
